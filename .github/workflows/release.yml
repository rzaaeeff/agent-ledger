name: release
on:
  push:
    tags: ["v*"]
  # Called by on-merge.yml once the tests for that commit are green.
  workflow_call:
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - id: v
        # A tag must name the version in VERSION. Called from a merge there is
        # no tag yet, so VERSION decides it and the release creates it.
        run: |
          set -eu
          tag="v$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION says $tag but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - run: go test ./...
      - run: scripts/release.sh "${TAG#v}"
        env:
          TAG: ${{ steps.v.outputs.tag }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/agent-ledger-*
      - run: gh release create "$TAG" dist/* --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
