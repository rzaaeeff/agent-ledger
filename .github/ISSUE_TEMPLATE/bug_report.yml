name: Bug report
description: Something agent-ledger did wrong, or an error it reported.
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code
        - Codex
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `agent-ledger version`, plus the version of Claude Code or Codex.
      placeholder: agent-ledger 0.1.3, Claude Code 2.1.314
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15, Ubuntu 24.04, Windows 11 with Git Bash, WSL2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you did and what happened
      description: The prompt or command you sent, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: agent-ledger status and config
      description: |
        Output of `agent-ledger status` and `agent-ledger config`, run from the agent's shell (`!agent-ledger status` in Claude Code).
        Pins are your own text: check it for anything private before posting.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `errors.log` (in the ledger folder) and `skips.log` (in `~/.local/state/agent-ledger/`), if any.
      render: text
